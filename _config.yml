# al-folio config — drop-in patches for github.com/mtusman-ai/M.Usman
# Migrate from beautiful-jekyll to al-folio per MIGRATION.md.

title: M Usman
description: >-
  Enterprise and Data Architect, and Applied-AI Researcher. PhD Computer Science (Huddersfield);
  18+ years of enterprise data and analytics leadership across MENA FMCG.

url: https://mtusman-ai.github.io
baseurl: /M.Usman

# Theme — pick one of the two lines depending on whether you install
# al-folio as a gem or as a remote_theme.
theme: al-folio
# remote_theme: alshedivat/al-folio

plugins:
  - jekyll-scholar
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-link-attributes

scholar:
  last_name: Usman
  first_name: [M]
  style: assets/bibliography/apa.csl
  source: /_bibliography
  bibliography: papers.bib
  bibliography_template: bib

author:
  name: M Usman
  email: mt_usman@outlook.com

# Social links — keep LinkedIn URL slug as-is; everything else uses 'M Usman'.
social:
  github_username: mtusman-ai
  linkedin_username: tariqusman   # LinkedIn URL slug — only allowed exception to the M-Usman display name rule
  email: mt_usman@outlook.com
  # scholar_userid:   # TODO: paste once a Google Scholar profile is published.

# Privacy / analytics
google_analytics:    # blank by default; M Usman can fill if desired.
google_site_verification:

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Pagination
paginate: 5
permalink: /blog/:year/:title/
